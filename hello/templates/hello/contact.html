{% extends "hello/layout.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="text-center mb-12">
        <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-4">Get In Touch</h1>
        <p class="text-lg text-slate-600">Have a question or want to work together? Send me a message!</p>
    </div>
    
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 md:p-12">
        <!-- A standard HTML form template. You can hook this up to Django forms or Formspree later! -->
        <form class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-700">Name</label>
                <input type="text" id="name" name="name" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border" placeholder="Your name">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
                <input type="email" id="email" name="email" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border" placeholder="you@example.com">
            </div>
            <div>
                <label for="message" class="block text-sm font-medium text-slate-700">Message</label>
                <textarea id="message" name="message" rows="4" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border" placeholder="Your message..."></textarea>
            </div>
            <div>
                <button type="button" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Send Message
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
