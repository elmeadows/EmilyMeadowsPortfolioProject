{% extends "hello/layout.html" %}
{% load static %}
{% block title %}Resume{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16 text-center">
    <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-4">Resume</h1>
    <p class="text-lg text-slate-600 mb-8">View my professional experience and education.</p>
    
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-16 flex flex-col items-center justify-center">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-blue-500 mb-4">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <h3 class="text-xl font-semibold text-slate-900 mb-2">Resume Document</h3>
        <p class="text-slate-500 mb-6">View or download a PDF copy of my latest resume.</p>
        <div class="flex flex-col sm:flex-row gap-3">
            <a href="{% static 'hello/Emily-Meadows-Resume.pdf' %}" target="_blank" rel="noopener" class="inline-flex justify-center items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 transition-colors">View PDF</a>
            <a href="{% static 'hello/Emily-Meadows-Resume.pdf' %}" download class="inline-flex justify-center items-center px-6 py-3 border border-blue-600 text-base font-medium rounded-md text-blue-600 bg-white hover:bg-blue-50 transition-colors">Download PDF</a>
        </div>
    </div>
</div>
{% endblock %}
