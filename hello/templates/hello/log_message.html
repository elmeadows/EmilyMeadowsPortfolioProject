{% extends "hello/layout.html" %}
{% block title %}
    Log a Message
{% endblock %}
{% block content %}
    <div class="container">
        <div class="form-hero">
            <h1>Log a Message</h1>
            <p class="form-subtitle">Share your thoughts, ideas, or important updates</p>
        </div>

        <div class="form-container">
            <form method="POST" class="log-form">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.message }}
                    <label for="id_message" class="form-label">Your Message</label>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg">Log Message</button>
                    <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
